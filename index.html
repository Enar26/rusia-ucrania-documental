<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171b19" />
    <title>Rusia y Ucrania · Atlas documental</title>
    <link rel="stylesheet" href="./app/presentacion.css" />
    <link rel="stylesheet" href="./app/edicion.css" />
    <script defer src="./app/contenido.js"></script>
    <script defer src="./app/vistas.js"></script>
    <script defer src="./app/historia-reciente.js"></script>
    <script defer src="./app/atlas-temporal.js"></script>
    <script defer src="./app/estudio.js"></script>
    <script defer src="./app/portal.js"></script>
    <script defer src="./app/presentacion.js"></script>
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="book" viewBox="0 0 24 24">
          <path
            d="M3 5q5-2 9 1.5Q16 3 21 5v14q-5-2-9 1.5Q8 17 3 19zM12 6.5v14"
          />
        </symbol>
        <symbol id="notes" viewBox="0 0 24 24">
          <path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5" />
        </symbol>
        <symbol id="expand" viewBox="0 0 24 24">
          <path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" />
        </symbol>
        <symbol id="index-icon" viewBox="0 0 24 24">
          <path d="M8 6h12M8 12h12M8 18h12M3 6h1M3 12h1M3 18h1" />
        </symbol>
        <symbol id="arrow" viewBox="0 0 24 24">
          <path d="M4 12h15m-6-6 6 6-6 6" />
        </symbol>
      </defs>
    </svg>
    <div id="portal">
      <div class="portal-bar"><a href="#inicio" class="masthead"><span class="compass" aria-hidden="true">✳</span> Atlas documental</a>
        <nav aria-label="Navegación del sitio"><a href="#inicio">Inicio</a><a href="#estudio">Zona del expositor</a><a href="#fuentes">Fuentes</a></nav></div>
      <div id="portal-content"></div>
    </div>
    <div id="player" hidden>
      <header>
        <div class="brand"><button id="home" aria-label="Volver al menú">⌂ <span>Inicio</span></button>
          <span>Archivo documental</span>
        </div>
        <span class="subject">Ciencias Sociales</span>
        <nav aria-label="Herramientas de exposición">
          <button data-panel="fuentes" aria-label="Fuentes de la escena">
            <svg><use href="#book" /></svg><span>Fuentes</span>
          </button>
          <button data-panel="notas" aria-label="Notas del expositor">
            <svg><use href="#notes" /></svg><span>Notas</span>
          </button>
          <button
            id="full"
            aria-label="Pantalla completa"
            title="Pantalla completa (F)"
          >
            <svg><use href="#expand" /></svg>
          </button>
        </nav>
      </header>
      <main>
        <div id="stage" role="region" aria-label="Escena proyectada">
          <noscript
            >Activa JavaScript para navegar por la presentación.</noscript
          >
        </div>
      </main>
      <footer>
        <button data-panel="indice" class="index">
          <svg><use href="#index-icon" /></svg>Índice
        </button>
        <div class="position">
          <span id="number"></span><span id="section"></span
          ><span id="step-count"></span>
        </div>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <div class="arrows">
          <button id="prev" aria-label="Retroceder un paso" title="Retroceder">
            <svg class="left"><use href="#arrow" /></svg></button
          ><button id="next">
            <span>Siguiente</span><svg><use href="#arrow" /></svg>
          </button>
        </div>
      </footer>
      <button id="restore" hidden>Mostrar controles</button>
      <dialog id="dialog" aria-labelledby="dialog-title">
        <div class="dialog-head">
          <h2 id="dialog-title"></h2>
          <button id="close" aria-label="Cerrar">×</button>
        </div>
        <div id="dialog-body"></div>
      </dialog>
      <span id="announce" class="sr" role="status"></span>
    </div>
  </body>
</html>
